version: 2

models:
  - name: mart_mailchimp__campaign_performance
    description: >
      Campaign performance metrics answering marketing questions:
      1) Are users clicking emails multiple times?
      2) What percentage of recipients click?
      3) Which topics (subjects) lead to most clicks?
    columns:
      - name: campaign_id
        description: Unique campaign identifier
        data_tests:
          - unique
          - not_null
      - name: subject_line
        description: Email subject line (topic indicator)
      - name: send_time
        description: When the campaign was sent
      - name: status
        description: Campaign status (filtered to 'sent' only)
      - name: emails_sent
        description: Total recipients
      - name: unique_clicks
        description: Distinct users who clicked (from campaign reports)
      - name: clicks_total
        description: All click events (from campaign reports)
      - name: click_rate
        description: Percentage of recipients who clicked (unique_clicks / emails_sent)
      - name: multi_clickers
        description: Count of users who clicked the same URL more than once
      - name: total_clicks
        description: Sum of all click_count values from click details
      - name: multi_click_pct
        description: Percentage of clickers who clicked multiple times
      - name: unique_opens
        description: Distinct users who opened
      - name: open_rate
        description: Percentage of recipients who opened

  - name: mart_email_to_web__users
    description: >
      User-level model joining Mailchimp subscribers with Amplitude website users.
      Enables funnel analysis: email subscriber -> email clicker -> website visitor.
    columns:
      - name: subscriber_hash
        description: Mailchimp subscriber ID (MD5 of email)
        data_tests:
          - unique
          - not_null
      - name: email_address
        description: Subscriber email (join key to Amplitude user_id)
      - name: full_name
        description: Subscriber name from Mailchimp
      - name: mailchimp_company
        description: Company from Mailchimp merge fields
      - name: is_subscribed
        description: Currently subscribed (status = 'subscribed')
      - name: subscribed_at
        description: When subscriber opted in
      - name: campaigns_clicked
        description: Number of distinct campaigns user clicked
      - name: total_email_clicks
        description: Total click count across all campaigns
      - name: first_click_campaign_date
        description: Date of earliest campaign clicked
      - name: last_click_campaign_date
        description: Date of most recent campaign clicked
      - name: has_website_activity
        description: True if user found in Amplitude data
      - name: amplitude_id
        description: Amplitude user ID (if matched)
      - name: last_website_visit
        description: Most recent website activity from Amplitude
      - name: amplitude_company
        description: Company derived from Amplitude data
      - name: funnel_stage
        description: "User classification: no_clicks, clicked_no_website, clicked_and_visited"
